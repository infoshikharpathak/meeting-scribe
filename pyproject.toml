[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meeting-scribe"
version = "0.1.0"
description = "AI-powered meeting summarizer built on agent-forge. Generates MOM, emails attendees, syncs Jira."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "streamlit>=1.35.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "openai>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_scribe"]
