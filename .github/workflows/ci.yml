name: CI

# No test suite yet — this is an honest smoke check, not a "tests passing"
# claim: verifies the package installs cleanly and the top-level package
# imports without error on a fresh environment. Dummy API keys avoid
# import-time failures from client construction (no network calls are made).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Import smoke test
        env:
          OPENAI_API_KEY: dummy-key-for-ci
        run: python -c "import meeting_scribe; print('meeting_scribe imports cleanly')"
